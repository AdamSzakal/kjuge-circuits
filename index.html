function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function stars(r){if(r==null)return '';var full=Math.round(r),s='';for(var i=0;i<3;i++)s+=(i<full?'★':'☆');
  return ' <span class="stars">'+s+'</span> <span class="rval">'+r.toFixed(1)+'</span>';}
function hav(a,b){var R=6371000,rad=Math.PI/180;var la1=a[0]*rad,la2=b[0]*rad;
  var dla=(b[0]-a[0])*rad,dlo=(b[1]-a[1])*rad;var h=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)*Math.sin(dlo/2);
  return 2*R*Math.asin(Math.sqrt(h));}
function tsp(C,start){var n=C.length;if(n<=1)return C.map(function(_,i){return i;});
  var unv={};for(var i=0;i<n;i++)if(i!==start)unv[i]=1;var order=[start],cur=start,cnt=n-1;
  while(cnt>0){var best=-1,bd=Infinity;for(var j in unv){var d=hav(C[cur],C[j]);if(d<bd){bd=d;best=+j;}}order.push(best);delete unv[best];cur=best;cnt--;}
  var improved=true,guard=0;
  while(improved&&guard++<60){improved=false;
    for(var i=1;i<n-1;i++){for(var k=i+1;k<n;k++){
      var a=C[order[i-1]],b=C[order[i]],c=C[order[k]],dd=(k+1<n?C[order[k+1]]:null);
      var before=hav(a,b)+(dd?hav(c,dd):0), after=hav(a,c)+(dd?hav(b,dd):0);
      if(after<before-1e-6){var lo=i,hi=k;while(lo<hi){var t=order[lo];order[lo]=order[hi];order[hi]=t;lo++;hi--;}improved=true;}
    }}}
  return order;}

var allChars={};
DATA.forEach(function(d){d.markers.forEach(function(m){m.b.forEach(function(b){b.chars.forEach(function(c){allChars[c]=(allChars[c]||0)+1;});});});});
var charList=Object.keys(allChars).sort(function(a,b){return allChars[b]-allChars[a];});
var listOn={}, gradeOn={}, charOn={};
DATA.forEach(function(d,i){listOn[i]=(i===0);});
GORD.forEach(function(g){gradeOn[g]=true;});
charList.forEach(function(c){charOn[c]=true;});

var bodyEl=document.body, panel=document.getElementById('panel'), fab=document.getElementById('fab');
function openPanel(){bodyEl.classList.add('open');panel.classList.remove('hidden');fab.classList.add('docked');}

fab.onclick=openPanel;document.getElementById('pclose').onclick=closePanel;document.getElementById('backdrop').onclick=closePanel;

/* ---- shareable state in URL hash ---- */
function parseHash(){
  var h=(location.hash||'').replace(/^#/,'');if(!h)return;
  var p={};h.split('&').forEach(function(kv){var a=kv.split('=');p[a[0]]=a[1]||'';});
  if(p.l!==undefined){DATA.forEach(function(_,i){listOn[i]=false;});p.l.split('-').filter(Boolean).forEach(function(i){listOn[+i]=true;});}
  if(p.g!==undefined){GORD.forEach(function(g){gradeOn[g]=false;});p.g.split('-').filter(Boolean).forEach(function(i){var g=GORD[+i];if(g)gradeOn[g]=true;});}
  if(p.c!==undefined){charList.forEach(function(c){charOn[c]=false;});p.c.split('-').filter(Boolean).forEach(function(i){var c=charList[+i];if(c)charOn[c]=true;});}
}
function syncHash(){
  var parts=[],lon=[];DATA.forEach(function(_,i){if(listOn[i])lon.push(i);});parts.push('l='+lon.join('-'));
  if(GORD.some(function(g){return !gradeOn[g];})){var gi=[];GORD.forEach(function(g,i){if(gradeOn[g])gi.push(i);});parts.push('g='+gi.join('-'));}
  if(charList.some(function(c){return !charOn[c];})){var ci=[];charList.forEach(function(c,i){if(charOn[c])ci.push(i);});parts.push('c='+ci.join('-'));}
  history.replaceState(null,'','#'+parts.join('&'));
}
document.getElementById('pshare').onclick=function(){var btn=this;syncHash();var url=location.href;
  function ok(){btn.textContent='✓ Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent='🔗 Share';btn.classList.remove('ok');},1400);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,function(){prompt('Copy this link:',url);});}
  else{prompt('Copy this link:',url);}
};

var listSel=document.getElementById('listSel');

  var row=document.createElement('div');
  row.className='listrow'+(listOn[i]?' on':'');row.dataset.i=i;row.style.setProperty('--dot',d.color);
  row.innerHTML='<span class="box">'+(listOn[i]?'✓':'')+'</span><span class="tt">'+d.title+' <span class="km">('+(d.dist/1000).toFixed(2)+' km)</span></span>';
  row.onclick=function(){var i=+this.dataset.i;listOn[i]=!listOn[i];
    this.classList.toggle('on',listOn[i]);this.querySelector('.box').textContent=listOn[i]?'✓':'';render(true);};
  listSel.appendChild(row);
});
function syncL(){[].forEach.call(listSel.children,function(r){var i=+r.dataset.i;r.classList.toggle('on',listOn[i]);r.querySelector('.box').textContent=listOn[i]?'✓':'';});}

var layer=L.layerGroup().addTo(map);
function boulderVisible(b){
  if(!gradeOn[b.grade]) return false;
  if(b.chars.length>0 && !b.chars.some(function(c){return charOn[c];})) return false;
  return true;}

function render(fit){
  layer.clearLayers();
  var sel=[];DATA.forEach(function(_,i){if(listOn[i])sel.push(i);});
  var col=sel.length===1?DATA[sel[0]].color:'#e6194B';
  var stopsMap={}, parkings=[];
  sel.forEach(function(li){
    var d=DATA[li];if(d.parking)parkings.push(d.parking);
    d.markers.forEach(function(m){
      var vis=m.b.filter(boulderVisible);if(vis.length===0)return;
      var key=m.lat.toFixed(6)+','+m.lng.toFixed(6);
      var s=stopsMap[key]||(stopsMap[key]={lat:m.lat,lng:m.lng,label:m.label,seen:{},b:[]});
      vis.forEach(function(b){if(!s.seen[b.url]){s.seen[b.url]=1;s.b.push(b);}});
    });
  });
  var stops=Object.keys(stopsMap).map(function(k){return stopsMap[k];});
  var nB=stops.reduce(function(a,s){return a+s.b.length;},0);
  document.getElementById('fabCnt').textContent=nB;
  if(stops.length===0){document.getElementById('stats').textContent=(sel.length?'0 boulders':'No lists selected');syncHash();return;}
  var C=stops.map(function(s){return [s.lat,s.lng];});
  var cl=C.reduce(function(a,c){return a+c[0];},0)/C.length, cg=C.reduce(function(a,c){return a+c[1];},0)/C.length;
  var park=null;parkings.forEach(function(p){if(park===null||hav([cl,cg],p)<hav([cl,cg],park))park=p;});
  var startIdx=0,bd=Infinity;C.forEach(function(c,i){var ref=park||[cl,cg];var d=hav(c,ref);if(d<bd){bd=d;startIdx=i;}});
  var order=tsp(C,startIdx);
  var line=[],dist=0,prev=park;
  order.forEach(function(oi,pos){
    var s=stops[oi];var pt=[s.lat,s.lng];line.push(pt);
    if(prev)dist+=hav(prev,pt);prev=pt;
    var sector=s.label.split(' · ').pop();
    var html='<b>'+(pos+1)+'. '+sector+'</b><br>'+s.b.slice().sort(function(a,b){return GORD.indexOf(a.grade)-GORD.indexOf(b.grade);}).map(function(b){
      var ch=b.chars.length?' <span style="color:#888">['+b.chars.map(cap).join(', ')+']</span>':'';
      return '<a href="'+b.url+'" target="_blank" rel="noopener">'+b.name+'</a> ('+b.grade+')'+stars(b.rating)+ch;
    }).join('<br>');
    var mk=L.circleMarker(pt,{radius:12,color:'#000',weight:1,fillColor:col,fillOpacity:.9}).addTo(layer);
    mk.bindTooltip(String(pos+1),{permanent:true,direction:'center',className:'num'});
    mk.bindPopup(html,{maxWidth:Math.min(320,window.innerWidth-40)});
  });
  if(line.length>1)L.polyline(line,{color:col,weight:4,opacity:.6}).addTo(layer);
  if(park)L.marker(park).addTo(layer).bindPopup('Parking / start');
  document.getElementById('stats').textContent=nB+' boulders · '+stops.length+' stops · '+(dist/1000).toFixed(2)+' km';
  if(fit){var pad=isMobile()?[30,30]:[50,50];map.fitBounds(line.concat(park?[park]:[]),{padding:pad});}
  syncHash();
}

parseHash();syncL();syncG();syncC();
render(true);
