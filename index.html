<!doctype html><html><head><meta charset="utf-8"><title>Kjuge Circuits</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--acc:#e6194B;--my:#4363d8}
*{box-sizing:border-box}
html,body,#map{height:100%;margin:0}
/* The map fills the screen: the page itself never scrolls. Without this, the
   panels parked below the bottom edge could be scrolled into view. */
html,body{overflow:hidden;overscroll-behavior:none}
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.leaflet-tooltip.num{background:transparent;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:12px;
  text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none}
/* The open stop: ring and number in one piece, so they never come apart. */
.adot{display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:4px solid #fff;color:#fff;font-weight:700;font-size:12px;
  text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.leaflet-popup-content{font:14px/1.55 system-ui;margin:12px 14px}
.phead{display:block;margin-bottom:2px}
.prow{margin:1px 0}
.leaflet-popup-content a,#sheet a{color:#0645ad;text-decoration:none}
.leaflet-popup-content a:active,#sheet a:active{text-decoration:underline}
/* Small screens get the stop as a sheet across the bottom instead of a popup. */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:#fff;
  border-radius:16px 16px 0 0;box-shadow:0 -2px 16px rgba(0,0,0,.25);
  max-height:55vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  font:14px/1.55 system-ui}
#sheet[hidden]{display:none}
/* The header holds still while the list of problems scrolls under it. */
#shead{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;
  background:#fff;border-bottom:1px solid #eee;border-radius:16px 16px 0 0;padding:12px 14px}
#shead b{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sclose{flex:none;background:none;border:none;font-size:26px;line-height:1;
  color:#888;cursor:pointer;padding:4px 10px}
#sbody{padding:2px 16px calc(16px + env(safe-area-inset-bottom))}
.stars{color:#f5a623;letter-spacing:1px}
.rval{color:#888;font-size:12px}
#fab{position:absolute;z-index:1200;top:calc(10px + env(safe-area-inset-top));left:10px;
  background:#222;color:#fff;border:none;border-radius:22px;padding:10px 16px;font-size:15px;font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;gap:8px}
#fab .cnt{background:var(--acc);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1300;display:none;opacity:0;transition:opacity .2s}
body.open #backdrop{display:block;opacity:1}
#panel,#editor{position:absolute;z-index:1400;top:10px;left:10px;width:270px;max-height:calc(100vh - 20px);
  background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
#panel.hidden{display:none}
/* The circuit editor is its own container, next to the filter panel. */
#editor{left:290px;width:330px;z-index:1450;display:none}
#editor.open{display:flex}
#phead,#ehead{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#222;color:#fff;position:sticky;top:0}
#ehead{background:var(--my)}
#phead b,#ehead b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pclose,#eclose{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:16px;font-size:18px;cursor:pointer}
#pshare,#edone{background:rgba(255,255,255,.15);border:none;color:#fff;height:32px;padding:0 12px;border-radius:16px;font-size:13px;cursor:pointer}
#pshare.ok{background:#3cb44b}
#pbody,#ebody{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 0 10px}
.sec{padding:10px 14px;border-top:1px solid #eee}
.sec:first-child{border-top:none}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hdr b{flex:1;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#444}
.mini{font-size:12px;padding:4px 10px;border:1px solid #ccc;background:#f7f7f7;border-radius:14px;cursor:pointer;min-height:30px}
.mini.pri{background:var(--my);border-color:var(--my);color:#fff;font-weight:600}
.mini.wide{display:block;width:100%;margin:8px 0 2px;min-height:40px;font-size:14px}
.mini.danger{color:#c00;border-color:#e3b6b6;background:#fff7f7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:18px;border:1.5px solid #ccc;
  background:#f2f2f2;color:#333;font-size:14px;cursor:pointer;user-select:none;min-height:38px;line-height:1}
.chip .n{font-size:11px;color:#888}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on .n{color:rgba(255,255,255,.85)}
.listrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border-radius:10px;
  border:1.5px solid #ddd;background:#fafafa;font-size:14px;cursor:pointer;min-height:44px;user-select:none}
.listrow.on{border-color:var(--acc);background:#fff;box-shadow:inset 0 0 0 1.5px var(--acc)}
.listrow .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.listrow.on .box{background:var(--dot,var(--acc));border-color:var(--dot,var(--acc))}
.listrow .tt{flex:1}
.listrow .km{color:#888;font-size:12px}
.listrow .edit{flex:none;background:none;border:none;color:#666;font-size:15px;cursor:pointer;padding:4px 6px;min-height:32px}
.listrow.editing{border-style:dashed;border-color:var(--dot,var(--my))}
.lgroup{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#999;margin:10px 0 2px}
.gsec{padding:13px 14px;background:#fafafa;border-top:1px solid #e4e4e4;border-bottom:1px solid #e4e4e4;
  cursor:pointer;user-select:none}
.gsec:hover{background:#f2f2f2}
.gsec.open{background:#f2f2f2;border-bottom-color:#ececec}
.gsec .row{display:flex;align-items:center;gap:10px}
.gsec .ttl{flex:1;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#333}
.gsec .badge{flex:none;background:var(--acc);color:#fff;border-radius:11px;padding:2px 9px;font-size:11px;font-weight:700}
/* Chevron drawn with two borders, so it stays crisp and big enough to see. */
.gsec .caret{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#555}
.gsec .caret::before{content:"";width:9px;height:9px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;
  transform:rotate(-45deg) translate(-2px,-2px);transition:transform .18s}
.gsec.open .caret::before{transform:rotate(45deg) translate(-1px,-1px)}
.gsec #fsum{display:block;margin-top:5px;font-size:12px;line-height:1.35;color:#444}
.gsec #fsum:empty{display:none}
#fbody{display:none}
#fbody.open{display:block}
#fbody>.sec:first-child{border-top:none}
.txt{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font:14px/1.3 inherit;min-height:42px;background:#fff}
.txt:focus{outline:none;border-color:var(--my)}
#q{margin-top:8px}
#qres{max-height:240px;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
#qres:empty{display:none}
.res{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;min-height:42px;user-select:none}
.res+.res{border-top:1px solid #f0f0f0}
.res:hover{background:#f4f4f4}
.res.on{background:#eef2ff}
.res .nm{flex:1;min-width:0;font-size:13px}
.res .nm small{display:block;color:#888;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .gr{flex:none;font-size:12px;font-weight:700;color:#555}
.res .add{flex:none;width:28px;height:28px;border-radius:14px;border:1.5px solid #bbb;background:#fff;color:#555;
  font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.res.on .add{background:var(--my);border-color:var(--my);color:#fff}
.myrow{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;border-top:1px solid #f0f0f0;
  cursor:pointer}
.myrow:hover{background:#f5f7fa}
.myrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The problem number, the same one the popup shows. */
.myrow .snum{flex:none;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.myrow .snum.none{background:#ccc;color:#666}
.leaflet-popup-content .pnum,#sheet .pnum{display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#333;color:#fff;
  font-size:11px;font-weight:700;margin-right:5px;vertical-align:middle}
.myrow.off{opacity:.55}
.myrow .flt{color:#c00;font-size:10px;font-weight:700;text-transform:uppercase}
.myrow .del{flex:none;background:none;border:none;color:#c00;cursor:pointer;font-size:16px;padding:4px 8px;min-height:32px}
.pbtn{margin-left:6px;font-size:11px;padding:3px 8px;border:1px solid #ccc;background:#f7f7f7;border-radius:11px;cursor:pointer;white-space:nowrap}
.ta{min-height:110px;resize:vertical;margin-top:8px;line-height:1.4}
#pasteBox[hidden]{display:none}
.note{color:#888;font-size:12px;margin-top:8px}
.note a{color:#0645ad}
#stats{color:#555;font-size:13px}
@media (max-width:600px){
  /* Parked panels are invisible and out of reach until they slide up; the
     visibility delay lets the slide-out finish first. */
  #panel,#editor{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;max-height:78vh;
    border-radius:16px 16px 0 0;transform:translateY(100%);visibility:hidden;
    transition:transform .25s ease,visibility 0s linear .25s;display:flex}
  body.open #panel,#editor.open{visibility:visible;transition:transform .25s ease}
  body.open #panel{transform:translateY(0)}
  #panel.hidden{display:flex}
  #editor{z-index:1450;transform:translateY(100%)}
  #editor.open{transform:translateY(0)}
  #pbody,#ebody{overscroll-behavior:contain}
  #pbody,#ebody{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .chip{padding:10px 14px;min-height:44px;font-size:15px}
  .mini{min-height:36px;padding:6px 12px}
  .leaflet-control-zoom{display:none}
  .leaflet-tooltip.num{font-size:15px}
  .adot{font-size:15px}
  /* A phone holds the stop in the sheet, where there is room for bigger text. */
  #sheet{font:16px/1.6 system-ui;max-height:60vh}
  #shead b{font-size:18px}
  #sbody{padding:2px 18px calc(18px + env(safe-area-inset-bottom))}
  #sheet .prow{padding:10px 0;margin:0}
  #sheet .prow+.prow{border-top:1px solid #eee}
  #sheet .pnum{min-width:26px;height:26px;border-radius:13px;font-size:14px;margin-right:8px}
  #sheet .pbtn{font-size:14px;padding:7px 14px;border-radius:16px;margin:6px 6px 0 0;min-height:36px}
  #sheet .rval,#sheet .prow span[style]{font-size:14px}
  #sclose{font-size:30px;padding:6px 12px}
}
@media (min-width:601px){#backdrop{display:none!important}#fab.docked{display:none}}
</style></head>
<body>
<button id="fab">☰ Lists <span class="cnt" id="fabCnt"></span></button>
<div id="backdrop"></div>
<div id="panel" class="hidden">
  <div id="phead"><b>Kjuge Circuits</b><button id="pshare" title="Copy a link to this circuit">🔗 Share</button><button id="pclose" aria-label="Close">×</button></div>
  <div id="pbody">
    <div class="sec"><div class="hdr"><b>Lists</b><button class="mini" id="lAll">All</button><button class="mini" id="lNone">None</button></div><div id="listSel"></div><div class="note" id="hiddenNote"></div></div>

      <span id="fsum"></span></div>
    <div id="fbody">

      <div class="note">Shows boulders with <b>any</b> selected characteristic (untagged always shown).</div></div>

    <div class="sec"><span id="stats"></span></div>

  </div>
</div>
<div id="editor">

    <div class="sec">

      <input id="q" class="txt" type="search" placeholder="Search all boulders…" autocomplete="off">
      <div id="qres"></div>
    </div>
    <div class="sec">
      <div class="hdr"><b>In this circuit</b><span id="ecnt" class="km"></span><button class="mini" id="myPaste">Paste list</button></div>
      <div id="pasteBox" hidden>
        <textarea id="pasteTa" class="txt ta" placeholder="Paste problem names — one per line, or comma separated.&#10;A grade after the name helps when two boulders share a name:&#10;&#10;Kaffe 4+&#10;Cappuccino, 4+&#10;Banracing"></textarea>
        <div class="hdr" style="margin:8px 0 0"><button class="mini pri" id="pasteAdd">Add to circuit</button><button class="mini" id="pasteCancel">Cancel</button></div>
        <div class="note" id="pasteMsg"></div>
      </div>
      <div id="myList"></div>
    </div>
    <div class="sec"><button class="mini danger" id="edel">Delete this circuit</button></div>
  </div>
</div>
<div id="map"></div>
<div id="sheet" hidden><div id="shead"><b id="stitle"></b><button id="sclose" aria-label="Close">×</button></div><div id="sbody"></div></div>

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function stars(r){if(r==null)return '';var full=Math.round(r),s='';for(var i=0;i<3;i++)s+=(i<full?'★':'☆');
  return ' <span class="stars">'+s+'</span> <span class="rval">'+r.toFixed(1)+'</span>';}
function hav(a,b){var R=6371000,rad=Math.PI/180;var la1=a[0]*rad,la2=b[0]*rad;
  var dla=(b[0]-a[0])*rad,dlo=(b[1]-a[1])*rad;var h=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)*Math.sin(dlo/2);
  return 2*R*Math.asin(Math.sqrt(h));}
function tsp(C,start){var n=C.length;if(n<=1)return C.map(function(_,i){return i;});
  var unv={};for(var i=0;i<n;i++)if(i!==start)unv[i]=1;var order=[start],cur=start,cnt=n-1;
  while(cnt>0){var best=-1,bd=Infinity;for(var j in unv){var d=hav(C[cur],C[j]);if(d<bd){bd=d;best=+j;}}order.push(best);delete unv[best];cur=best;cnt--;}
  var improved=true,guard=0;
  while(improved&&guard++<60){improved=false;
    for(var i=1;i<n-1;i++){for(var k=i+1;k<n;k++){
      var a=C[order[i-1]],b=C[order[i]],c=C[order[k]],dd=(k+1<n?C[order[k+1]]:null);
      var before=hav(a,b)+(dd?hav(c,dd):0), after=hav(a,c)+(dd?hav(b,dd):0);
      if(after<before-1e-6){var lo=i,hi=k;while(lo<hi){var t=order[lo];order[lo]=order[hi];order[hi]=t;lo++;hi--;}improved=true;}
    }}}
  return order;}

/* ---- shareable state in URL hash ---- */
// "~" and "!" separate the fields, so they never survive inside a name.
function encParam(s){return encodeURIComponent(s).replace(/~/g,'%7E').replace(/!/g,'%21');}
function decParam(s){try{return decodeURIComponent(s);}catch(e){return s;}}
function parseHash(){
  var h=(location.hash||'').replace(/^#/,'');if(!h)return;
  var p={};h.split('&').forEach(function(kv){var a=kv.split('=');p[a[0]]=a[1]||'';});
  if(p.l!==undefined){DATA.forEach(function(_,i){listOn[i]=false;});p.l.split('-').filter(Boolean).forEach(function(i){listOn[+i]=true;});}
  // Grades travel as names, and an unknown name switches the whole grade
  // filter off rather than hiding boulders by accident.
  if(p.g!==undefined){
    var gs=p.g.split('.').filter(Boolean).map(decParam).filter(function(g){return gradeOn[g]!==undefined;});
    if(gs.length){GORD.forEach(function(g){gradeOn[g]=false;});gs.forEach(function(g){gradeOn[g]=true;});}
  }
  if(p.c!==undefined){
    var cs=p.c.split('.').filter(Boolean).map(decParam).filter(function(c){return charOn[c]!==undefined;});
    if(cs.length){charList.forEach(function(c){charOn[c]=false;});cs.forEach(function(c){charOn[c]=true;});}
  }
  if(p.r!==undefined){minRating=parseFloat(p.r)||0;}
  // Circuits: "on~name~ids" groups split by "!", route ids in base 36.
  if(p.x!==undefined&&p.x){
    CIRCUITS=[];
    p.x.split('!').filter(Boolean).forEach(function(g){
      var f=g.split('~'), on=true, nm='', ids=f[0];
      if(f.length>=3){on=f[0]!=='0';nm=decParam(f[1]);ids=f[2];}
      else if(p.xn!==undefined){nm=decParam(p.xn);on=p.xo!=='0';}   // links of the first version
      var list=ids.split('.').filter(Boolean).map(function(s){return parseInt(s,36);}).filter(function(id){return BY_ID[id];});
      if(list.length)CIRCUITS.push({n:nm,ids:list,on:on});
    });
  }
  if(p.h!==undefined){hideIds={};p.h.split('.').filter(Boolean).forEach(function(s){hideIds[parseInt(s,36)]=1;});}
  if(p.a!==undefined){browseAll=p.a==='1';}
}
function syncHash(){
  var parts=[],lon=[];DATA.forEach(function(_,i){if(listOn[i])lon.push(i);});parts.push('l='+lon.join('-'));
  if(GORD.some(function(g){return !gradeOn[g];})){var gi=[];GORD.forEach(function(g){if(gradeOn[g])gi.push(encParam(g));});parts.push('g='+gi.join('.'));}
  if(charList.some(function(c){return !charOn[c];})){var ci=[];charList.forEach(function(c){if(charOn[c])ci.push(encParam(c));});parts.push('c='+ci.join('.'));}
  if(minRating>0)parts.push('r='+minRating);
  var cs=CIRCUITS.filter(function(c){return c.ids.length;});
  if(cs.length)parts.push('x='+cs.map(function(c){
    return (c.on?'1':'0')+'~'+encParam(c.n)+'~'+c.ids.map(function(id){return id.toString(36);}).join('.');
  }).join('!'));
  var hid=Object.keys(hideIds);
  if(hid.length)parts.push('h='+hid.map(function(id){return (+id).toString(36);}).join('.'));
  if(browseAll)parts.push('a=1');
  history.replaceState(null,'','#'+parts.join('&'));
}

  function ok(){btn.textContent='✓ Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent='🔗 Share';btn.classList.remove('ok');},1400);}

function listRow(o){
  return '<div class="listrow'+(o.on?' on':'')+(o.editing?' editing':'')+'" data-t="'+o.t+'" data-i="'+o.i+'" style="--dot:'+o.color+'">'+
    '<span class="box">'+(o.on?'\u2713':'')+'</span>'+
    '<span class="tt">'+esc(o.title)+' <span class="km">('+o.meta+')</span></span>'+
    (o.edit?'<button class="edit" title="Edit this circuit">\u270e</button>':'')+'</div>';
}
function renderLists(){
  var h=listRow({t:'a',i:0,on:browseAll,color:BROWSE_COL,title:'All boulders',meta:ALL.length});
  h+=DATA.map(function(d,i){
    return listRow({t:'d',i:i,on:listOn[i],color:d.color,title:d.title,meta:(d.dist/1000).toFixed(2)+' km'});
  }).join('');
  h+='<div class="lgroup">My circuits</div>';
  h+=CIRCUITS.map(function(c,i){
    return listRow({t:'c',i:i,on:c.on,color:circuitColor(i),title:circuitName(i),meta:c.ids.length,edit:true,editing:i===editIdx});
  }).join('');
  if(!CIRCUITS.length)h+='<div class="note">None yet \u2014 build one from any boulder in the dataset.</div>';
  h+='<button class="mini pri wide" id="lNew">+ New circuit</button>';
  listSel.innerHTML=h;
}
listSel.onclick=function(ev){
  if(ev.target.id==='lNew'){openEditor();return;}
  var row=ev.target.closest('.listrow');if(!row)return;
  var i=+row.dataset.i;
  if(row.dataset.t==='a'){
    browseAll=!browseAll;
  }else if(row.dataset.t==='c'){
    if(ev.target.classList.contains('edit')){openEditor(i);return;}
    CIRCUITS[i].on=!CIRCUITS[i].on;
  }else{
    listOn[i]=!listOn[i];
  }
  renderLists();render(true);
};

var fhead=document.getElementById('fhead'), fbody=document.getElementById('fbody'), fsum=document.getElementById('fsum'),
    fReset=document.getElementById('fReset'), fbadge=document.getElementById('fbadge');
function foldFilters(open){
  fbody.classList.toggle('open',open);
  fhead.classList.toggle('open',open);
}
fhead.onclick=function(ev){
  if(ev.target.id==='fReset'){resetFilters();return;}
  foldFilters(!fbody.classList.contains('open'));
};
function resetFilters(){
  GORD.forEach(function(g){gradeOn[g]=true;});
  charList.forEach(function(c){charOn[c]=true;});
  minRating=0;hideIds={};
  syncG();syncC();syncR();render(false);
}
// Header text says at a glance whether anything is being filtered away.
function updateFSum(){
  var gOff=GORD.filter(function(g){return !gradeOn[g];}).length;
  var cOff=charList.filter(function(c){return !charOn[c];}).length;
  var nHid=Object.keys(hideIds).length;
  var bits=[];
  if(gOff)bits.push(gOff+' of '+GORD.length+' grades off');
  if(cOff)bits.push(cOff+' of '+charList.length+' characters off');
  if(minRating)bits.push('min '+minRating+'★');
  if(nHid)bits.push(nHid+' hidden');
  var narrowed=bits.length>0;
  fsum.textContent=narrowed?bits.join(' · '):'';
  fhead.classList.toggle('narrowed',narrowed);
  fbadge.hidden=!narrowed;fbadge.textContent=bits.length;
  fReset.hidden=!narrowed;
}

function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function bslug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function circuitColor(i){return PAL[i%PAL.length];}
function circuitName(i){return CIRCUITS[i].n||('Circuit '+(i+1));}

// Turns one ALL row into the same shape of boulder the map popups already use.
function toB(e){
  var s=SECT[e[4]], c=CRAGS[s[0]];
  var url='https://27crags.com/crags/'+c[0]+'/routes/'+(e[5]||bslug(e[1]));
  return {id:e[0],name:e[1],grade:e[2],rating:e[3]<0?null:e[3],chars:CHARS_BY_URL[url]||[],
    url:url,lat:s[2],lng:s[3],label:c[1]+' \u00b7 '+s[1],cragIdx:s[0],mine:true};
}
// Every boulder of every switched-on circuit.
function mineBoulders(){
  var out=[],seen={};
  CIRCUITS.forEach(function(c){
    if(!c.on)return;
    c.ids.forEach(function(id){if(BY_ID[id]&&!seen[id]){seen[id]=1;out.push(toB(BY_ID[id]));}});
  });
  return out;
}

// Every list boulder also exists in the full index, so it gets the same id.
var ID_BY_URL={};
ALL.forEach(function(e){var s=SECT[e[4]];ID_BY_URL['https://27crags.com/crags/'+CRAGS[s[0]][0]+'/routes/'+(e[5]||bslug(e[1]))]=e[0];});
// Characteristics were only scraped for the boulders in the top-lists.
var CHARS_BY_URL={};
DATA.forEach(function(d){d.markers.forEach(function(m){m.b.forEach(function(b){
  CHARS_BY_URL[b.url]=b.chars;b.id=ID_BY_URL[b.url];});});});

function newCircuit(name){CIRCUITS.push({n:name||'',ids:[],on:true});return CIRCUITS.length-1;}
// Where a "+" outside the editor puts a boulder.
function targetIdx(){
  if(editIdx>=0)return editIdx;
  if(CIRCUITS.length)return CIRCUITS.length-1;
  return newCircuit('');
}
function addToCircuit(id,ci){
  if(!BY_ID[id])return false;
  if(ci===undefined)ci=targetIdx();
  var c=CIRCUITS[ci];if(c.ids.indexOf(id)>=0)return false;
  c.ids.push(id);delete hideIds[id];return true;
}
function removeFromCircuit(id,ci){
  var hit=false;
  CIRCUITS.forEach(function(c,i){
    if(ci!==undefined&&i!==ci)return;
    var k=c.ids.indexOf(id);if(k>=0){c.ids.splice(k,1);hit=true;}
  });
  return hit;
}
function inCircuit(id){return editIdx>=0&&CIRCUITS[editIdx].ids.indexOf(id)>=0;}

/* ---- free-text search over every boulder in the dataset ---- */
var IDX=null;
function buildIdx(){IDX=ALL.map(function(e){var s=SECT[e[4]];
  return norm(e[1]+' '+e[2]+' '+CRAGS[s[0]][1]+' '+s[1]);});}
function search(q){
  if(!IDX)buildIdx();
  var toks=norm(q).trim().split(/\s+/).filter(Boolean);if(!toks.length)return [];
  var hits=[];
  for(var i=0;i<ALL.length&&hits.length<400;i++){
    var t=IDX[i],ok=true;
    for(var k=0;k<toks.length;k++){if(t.indexOf(toks[k])<0){ok=false;break;}}
    if(!ok)continue;
    var nm=norm(ALL[i][1]);
    // Name matches rank above crag/sector matches.
    var rank=nm.indexOf(toks[0])===0?0:(nm.indexOf(toks[0])>=0?1:2);
    hits.push([rank,ALL[i]]);
  }
  hits.sort(function(a,b){return a[0]-b[0];});
  return hits.slice(0,40).map(function(h){return h[1];});
}

/* ---- pasting a list of problem names ---- */
var NAME_IDX=null;
function buildNameIdx(){
  NAME_IDX={};
  ALL.forEach(function(e){
    [norm(e[1]).replace(/\s+/g,' ').trim(),bslug(e[1]),compact(e[1]),e[5]||''].forEach(function(k){
      if(!k)return;(NAME_IDX[k]=NAME_IDX[k]||[]).push(e);});
  });
}
// Every grade string the data uses, so "3", "4+" and "6A" all count.
var GSET={};GORD.forEach(function(g){GSET[g.toUpperCase()]=1;});ALL.forEach(function(e){GSET[e[2].toUpperCase()]=1;});
function isGrade(t){return GSET[t.trim().toUpperCase()]===1;}
// Accepts one name per line, comma separated names, "name, grade" and "name grade".
function parsePasted(text){
  var rows=[];
  text.split(/\r?\n/).forEach(function(ln){
    ln=ln.replace(/^\s*[\d]+[.)]\s*/,'').trim();
    if(!ln||/^(name|problem|boulder)\b/i.test(ln))return;
    ln.split(/[;\t,]/).forEach(function(p){
      p=p.trim().replace(/^["']|["']$/g,'');
      if(!p)return;
      if(isGrade(p)&&rows.length){rows[rows.length-1].grade=p;return;}
      // "Kaffe 4+" — a grade at the end of the name, with only a space before it.
      var m=p.match(/^(.*\S)\s+(\S+)$/);
      if(m&&isGrade(m[2])){rows.push({name:m[1],grade:m[2]});return;}
      rows.push({name:p,grade:''});
    });
  });
  return rows;
}
function compact(s){return norm(s).replace(/[^a-z0-9]/g,'');}
function words(s){return norm(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);}
// Edit distance, but it gives up as soon as the two names are too far apart.
function lev(a,b){
  if(a===b)return 0;
  var m=a.length,n=b.length;if(Math.abs(m-n)>2)return 99;
  var prev=[],cur=[],i,j;
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;var best=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<best)best=cur[j];
    }
    if(best>2)return 99;
    prev=cur.slice();
  }
  return prev[n];
}
// A typo ("Capuccino") is corrected on the spot; a different word
// ("… a problem" for "… a boulder") is only offered as a suggestion.
function fuzzy(name,grade){
  var q=compact(name), qw=words(name), need=Math.max(2,Math.ceil(qw.length/2));
  var best=null,bd=99,pre=null,pn=0;
  for(var i=0;i<ALL.length;i++){
    var e=ALL[i], d=lev(q,compact(e[1]));
    var better=d<bd||(d===bd&&grade&&best&&best[2].toUpperCase()!==grade.toUpperCase()&&e[2].toUpperCase()===grade.toUpperCase());
    if(better){bd=d;best=e;}
    var tw=words(e[1]),k=0;while(k<qw.length&&k<tw.length&&qw[k]===tw[k])k++;
    if(k>pn&&k>=need){pn=k;pre=e;}
  }
  if(best&&bd<=1)return {e:best,kind:'auto'};
  if(best&&bd<=2)return {e:best,kind:'suggest'};
  if(pre)return {e:pre,kind:'suggest'};
  return null;
}
function matchName(name,grade){
  if(!NAME_IDX)buildNameIdx();
  var c=NAME_IDX[norm(name).replace(/\s+/g,' ').trim()]||NAME_IDX[bslug(name)]||NAME_IDX[compact(name)]||[];
  if(!c.length)return null;
  if(grade){var g=c.filter(function(e){return e[2].toUpperCase()===grade.toUpperCase();});if(g.length)c=g;}
  // Same name in several crags: take the best rated one.
  return c.slice().sort(function(a,b){return b[3]-a[3];})[0];
}

/* ---- the editor container ---- */

var qEl=document.getElementById('q'), qres=document.getElementById('qres'), myListEl=document.getElementById('myList');
var nameEl=document.getElementById('myName'), etitle=document.getElementById('etitle'), ecnt=document.getElementById('ecnt');
var pasteBox=document.getElementById('pasteBox'), pasteTa=document.getElementById('pasteTa'), pasteMsg=document.getElementById('pasteMsg');

function openEditor(i){

document.getElementById('edone').onclick=closeEditor;

/* ---- search results ---- */
function renderRes(){
  var q=qEl.value.trim();
  if(!q){qres.innerHTML='';return;}
  var hits=search(q);
  if(!hits.length){qres.innerHTML='<div class="note">No boulder matches \u201c'+esc(q)+'\u201d.</div>';return;}
  qres.innerHTML=hits.map(function(e){var s=SECT[e[4]],on=inCircuit(e[0]);
    return '<div class="res'+(on?' on':'')+'" data-id="'+e[0]+'">'+
      '<span class="nm">'+esc(e[1])+stars(e[3]<0?null:e[3])+'<small>'+esc(CRAGS[s[0]][1]+' \u00b7 '+s[1])+'</small></span>'+
      '<span class="gr">'+esc(e[2])+'</span>'+
      '<button class="add" aria-label="Add to this circuit">'+(on?'\u2713':'+')+'</button></div>';
  }).join('');
}
qres.onclick=function(ev){
  var row=ev.target.closest('.res');if(!row||editIdx<0)return;
  var id=+row.dataset.id, added=inCircuit(id)?!removeFromCircuit(id,editIdx):addToCircuit(id,editIdx);
  renderRes();renderPicked();renderLists();render(false,added?id:null);
};
var qT;qEl.oninput=function(){clearTimeout(qT);qT=setTimeout(renderRes,120);};

/* ---- the boulders of the circuit being edited ---- */
function renderPicked(){
  if(editIdx<0)return;
  var ids=CIRCUITS[editIdx].ids;
  ecnt.textContent=ids.length?ids.length+' boulders':'';
  if(!ids.length){myListEl.innerHTML='<div class="note">Search above and tap <b>+</b>, or paste a list of names. This circuit gets its own walking route, and the <b>Share</b> link carries it.</div>';return;}
  // Same order and same numbers as the popups: problem by problem along the
  // walking route. Problems that are not drawn (filtered out, or the circuit is
  // switched off) have no number and go last.
  var rows=ids.map(function(id,i){return {id:id,i:i,n:PROBNUM[id]||0,b:toB(BY_ID[id])};});
  rows.sort(function(a,b){
    if(a.n!==b.n)return (a.n||1e9)-(b.n||1e9);
    return a.i-b.i;
  });
  myListEl.innerHTML=rows.map(function(r){var b=r.b, vis=boulderVisible(b);
    return '<div class="myrow'+(vis?'':' off')+'" data-id="'+b.id+'">'+
      '<span class="snum'+(r.n?'':' none')+'">'+(r.n||'\u2013')+'</span>'+
      '<span class="nm">'+esc(b.name)+' <b>'+esc(b.grade)+'</b>'+(vis?'':' <span class="flt">filtered out</span>')+
      '<br><small style="color:#888">'+esc(b.label)+'</small></span>'+
      '<button class="del" title="Remove">\u00d7</button></div>';
  }).join('');
}
myListEl.onclick=function(ev){
  var row=ev.target.closest('.myrow');if(!row)return;
  var id=+row.dataset.id;
  if(ev.target.classList.contains('del')){removeFromCircuit(id,editIdx);renderRes();renderPicked();renderLists();render(false);return;}
  // Anywhere else on the row shows the problem on the map, with its popup open.
  var b=toB(BY_ID[id]);map.setView([b.lat,b.lng],17);if(isMobile())closePanel();
  openStop(HIT_BY_ID[id]);
};

/* ---- paste ---- */
document.getElementById('myPaste').onclick=function(){pasteBox.hidden=!pasteBox.hidden;if(!pasteBox.hidden)pasteTa.focus();};
document.getElementById('pasteCancel').onclick=function(){pasteBox.hidden=true;pasteTa.value='';pasteMsg.textContent='';};
document.getElementById('pasteAdd').onclick=function(){
  if(editIdx<0)return;
  var rows=parsePasted(pasteTa.value), added=0, dup=0, fixed=[], sugg=[], miss=[];
  rows.forEach(function(r){
    var e=matchName(r.name,r.grade);
    if(!e){
      var f=fuzzy(r.name,r.grade);
      if(f&&f.kind==='auto'){e=f.e;fixed.push(r.name+' \u2192 '+f.e[1]);}
      else if(f){sugg.push([r.name,f.e]);return;}
      else{miss.push(r.name);return;}
    }
    if(addToCircuit(e[0],editIdx))added++;else dup++;
  });
  var msg=['<b>Added '+added+'</b> of '+rows.length+'.'];
  if(dup)msg.push(dup+' already in the circuit.');
  if(fixed.length)msg.push('Spelling fixed: '+fixed.map(esc).join(', ')+'.');
  if(sugg.length)msg.push('<br>Did you mean: '+sugg.map(function(s){
    return '<button class="mini sug" data-id="'+s[1][0]+'">'+esc(s[0])+' \u2192 '+esc(s[1][1])+' ('+esc(s[1][2])+')</button>';
  }).join(' '));
  if(miss.length)msg.push('<br>Not found: '+miss.map(esc).join(', ')+'.');
  pasteMsg.innerHTML=msg.join(' ');
  if(added){pasteTa.value='';renderRes();renderPicked();renderLists();render(true);}
};
// One tap accepts a suggested name.
pasteMsg.onclick=function(ev){
  var b=ev.target.closest?ev.target.closest('.sug'):null;if(!b||editIdx<0)return;
  addToCircuit(+b.dataset.id,editIdx);b.parentNode.removeChild(b);
  renderRes();renderPicked();renderLists();render(true);
};

/* ---- hidden list boulders ---- */
document.getElementById('hiddenNote').onclick=function(ev){
  if(!ev.target.classList.contains('unhide'))return;
  hideIds={};render(false);
};

/* ---- one stop: a popup on a big screen, a bottom sheet on a phone ---- */
var sheet=document.getElementById('sheet'), sbody=document.getElementById('sbody'),
    stitle=document.getElementById('stitle');
// The dot of the open stop stays big, with a white ring, so the map shows
// which stop the popup or the sheet belongs to.
var activeDot=null, activeMark=null;
function dotLook(dot,state){
  if(!dot)return;
  if(state==='hover')dot.setStyle({radius:DOT_R+4,color:'#fff',weight:3,fillOpacity:1});
  else dot.setStyle({radius:DOT_R,color:'#000',weight:1,fillOpacity:.9});
  if(state==='hover')dot.bringToFront();
}
function clearActiveDot(){
  if(activeMark){map.removeLayer(activeMark);activeMark=null;}
  if(activeDot){dotLook(activeDot,'idle');activeDot=null;}
}
function setActiveDot(hit){
  clearActiveDot();
  if(!hit||!hit._dot)return;
  activeDot=hit._dot;
  // One marker holds ring and number together, in the pane above the labels.
  var s=2*(DOT_R+5);
  activeMark=L.marker(hit.getLatLng(),{pane:'activePane',interactive:false,keyboard:false,
    icon:L.divIcon({className:'adot',iconSize:[s,s],
      html:'<span style="background:none">'+hit._num+'</span>'})}).addTo(map);
  activeMark.getElement().style.background=hit._col;
}
function closeSheet(){sheet.hidden=true;sbody.innerHTML='';stitle.textContent='';clearActiveDot();}
function closeStop(){map.closePopup();closeSheet();}
function openStop(hit){
  if(!hit)return;
  if(isMobile()){map.closePopup();stitle.textContent=hit._num+'. '+(hit._title||'');
    sbody.innerHTML=hit._body||'';sheet.hidden=false;sheet.scrollTop=0;}
  else{closeSheet();hit.openPopup();}
  setActiveDot(hit);
}
// A popup opened by a click straight on the dot marks it active too.
map.on('popupopen',function(e){if(e.popup._source)setActiveDot(e.popup._source);});
map.on('popupclose',clearActiveDot);
document.getElementById('sclose').onclick=closeSheet;
// A tap on empty map closes the sheet; taps on a stop stop at the stop.
map.on('click',closeSheet);

/* ---- buttons inside the map popups and the sheet ---- */
document.addEventListener('click',function(ev){
  var btn=ev.target.closest?ev.target.closest('.pbtn'):null;if(!btn)return;
  var id=+btn.dataset.id;
  // Removing is done in the circuit list, not here.
  if(btn.classList.contains('ad'))addToCircuit(id);
  else if(btn.classList.contains('hd'))hideIds[id]=1;
  closeStop();renderRes();renderPicked();renderLists();render(false);

var layer=L.layerGroup().addTo(map);
// Dot size, plus a bigger invisible tap target (phones need ~44px across).
var DOT_R=isMobile()?15:13, HIT_R=isMobile()?26:20;
// True for a real mouse; touch screens skip the hover effect.
var canHover=window.matchMedia('(hover:hover)').matches;
window.addEventListener('resize',function(){
  var d=isMobile()?15:13;
  // Crossing the phone/desktop line also swaps sheet for popup, so redraw.
  if(d!==DOT_R){DOT_R=d;HIT_R=isMobile()?26:20;closeStop();render(false);}
});
function boulderVisible(b){
  if(b.id&&hideIds[b.id]) return false;
  if(!gradeOn[b.grade]) return false;
  if(Math.round(b.rating==null?0:b.rating) < minRating) return false;
  if(b.chars.length>0 && !b.chars.some(function(c){return charOn[c];})) return false;
  return true;}

function render(fit,focusId){
  layer.clearLayers();
  // The dots are drawn again below, so the old active one is gone.
  PROBNUM={};HIT_BY_ID={};clearActiveDot();
  updateFSum();
  var nHid=Object.keys(hideIds).length;
  document.getElementById('hiddenNote').innerHTML=nHid?nHid+' boulder'+(nHid>1?'s':'')+' hidden. <a href="#" class="unhide" onclick="return false">Show all</a>':'';
  var sel=[];DATA.forEach(function(_,i){if(listOn[i])sel.push(i);});
  var mine=mineBoulders().filter(boulderVisible);
  var onC=[];CIRCUITS.forEach(function(c,i){if(c.on&&c.ids.length)onC.push(i);});
  // Browsing the whole dataset drops the route: 500+ sectors over 14 crags are
  // not one walk, so the map only shows where every boulder is.
  var browse=browseAll;
  // one list or one circuit keeps its own colour; a mix is drawn in red.
  var col=(!sel.length&&onC.length===1)?circuitColor(onC[0]):(sel.length===1&&!mine.length?DATA[sel[0]].color:'#e6194B');
  if(browse&&!sel.length&&!onC.length)col=BROWSE_COL;
  var stopsMap={}, parkings=[];
  sel.forEach(function(li){
    var d=DATA[li];if(d.parking)parkings.push(d.parking);
    d.markers.forEach(function(m){
      var vis=m.b.filter(boulderVisible);if(vis.length===0)return;
      var key=m.lat.toFixed(6)+','+m.lng.toFixed(6);
      var s=stopsMap[key]||(stopsMap[key]={lat:m.lat,lng:m.lng,label:m.label,seen:{},b:[]});
      vis.forEach(function(b){if(!s.seen[b.url]){s.seen[b.url]=1;s.b.push(b);}});
    });
  });
  // Circuits join the same stops. The filters above apply to them too.
  mine.forEach(function(b){
    var key=b.lat.toFixed(6)+','+b.lng.toFixed(6);
    var s=stopsMap[key]||(stopsMap[key]={lat:b.lat,lng:b.lng,label:b.label,seen:{},b:[]});
    if(s.seen[b.url]){s.b.forEach(function(x){if(x.url===b.url)x.mine=true;});}
    else{s.seen[b.url]=1;s.b.push(b);}
    var p=CRAGS[b.cragIdx];if(p[2]!=null)parkings.push([p[2],p[3]]);
  });
  // Every boulder of the dataset, added the same way as the circuit boulders.
  if(browse){
    ALL.forEach(function(e){
      var b=toB(e);b.mine=false;
      if(!boulderVisible(b))return;
      var key=b.lat.toFixed(6)+','+b.lng.toFixed(6);
      var s=stopsMap[key]||(stopsMap[key]={lat:b.lat,lng:b.lng,label:b.label,seen:{},b:[]});
      if(!s.seen[b.url]){s.seen[b.url]=1;s.b.push(b);}
    });
  }
  var stops=Object.keys(stopsMap).map(function(k){return stopsMap[k];});
  var nB=stops.reduce(function(a,s){return a+s.b.length;},0);
  document.getElementById('fabCnt').textContent=nB;
  if(stops.length===0){document.getElementById('stats').textContent=((sel.length||browse)?'0 boulders':'Nothing selected');renderPicked();syncHash();return;}
  var C=stops.map(function(s){return [s.lat,s.lng];});
  var cl=C.reduce(function(a,c){return a+c[0];},0)/C.length, cg=C.reduce(function(a,c){return a+c[1];},0)/C.length;
  var park=null;parkings.forEach(function(p){if(park===null||hav([cl,cg],p)<hav([cl,cg],park))park=p;});
  var startIdx=0,bd=Infinity;C.forEach(function(c,i){var ref=park||[cl,cg];var d=hav(c,ref);if(d<bd){bd=d;startIdx=i;}});
  var order=browse?C.map(function(_,i){return i;}):tsp(C,startIdx);
  var line=[],dist=0,prev=park,probN=0;
  order.forEach(function(oi,pos){
    var s=stops[oi];var pt=[s.lat,s.lng];line.push(pt);
    if(!browse){if(prev)dist+=hav(prev,pt);prev=pt;}
    var sector=s.label.split(' · ').pop();
    // Problems keep counting along the route, so every problem has one number.
    var probs=s.b.slice().sort(function(a,b){return GORD.indexOf(a.grade)-GORD.indexOf(b.grade);});
    var nums=probs.map(function(){return browse?0:++probN;});
    if(!browse)probs.forEach(function(b,k){var bid=b.id||ID_BY_URL[b.url];if(bid)PROBNUM[bid]=nums[k];});
    // A phone opens the link in the same tab: a new tab keeps iOS in Safari
    // instead of handing the address over to the 27crags app.
    var tgt=isMobile()?'':' target="_blank" rel="noopener"';
    var body=probs.map(function(b,k){
      var ch=b.chars.length?' <span style="color:#888">['+b.chars.map(cap).join(', ')+']</span>':'';
      var id=b.id||ID_BY_URL[b.url];
      // The sheet only reads: adding and hiding stay on the big screen.
      var act=(!id||b.mine||isMobile())?'':(
        '<button class="pbtn ad" data-id="'+id+'">+ '+esc(CIRCUITS.length?circuitName(targetIdx()):'new circuit')+'</button>'+
        '<button class="pbtn hd" data-id="'+id+'">hide</button>');
      var num=nums[k]?'<span class="pnum">'+nums[k]+'</span>':'';
      return '<div class="prow">'+num+'<a href="'+b.url+'"'+tgt+'>'+b.name+'</a> ('+b.grade+')'+stars(b.rating)+ch+act+'</div>';
    }).join('');
    var html='<b class="phead">'+esc(sector)+'</b>'+body;
    // Visible dot: only decoration, so it never steals a tap from the hit area.
    var dot=L.circleMarker(pt,{pane:'stopPane',radius:DOT_R,color:'#000',weight:1,fillColor:col,fillOpacity:.9,interactive:false}).addTo(layer);
    // Invisible, larger circle that catches clicks and taps around the dot.
    // bubblingMouseEvents:false keeps the tap on the stop: otherwise it also
    // counts as a tap on the map, which closes the sheet again at once.
    var hit=L.circleMarker(pt,{pane:'stopPane',radius:HIT_R,stroke:false,fillColor:col,fillOpacity:.001,bubblingMouseEvents:false}).addTo(layer);
    hit._dot=dot;hit._num=pos+1;hit._col=col;hit._title=sector;hit._body=body;
    if(canHover){
      // Grow the dot while the pointer is over the hit area. The open stop keeps
      // its active look, so hovering it changes nothing.
      hit.on('mouseover',function(){if(dot!==activeDot)dotLook(dot,'hover');});
      hit.on('mouseout',function(){if(dot!==activeDot)dotLook(dot,'idle');});
    }
    probs.forEach(function(b){var bid=b.id||ID_BY_URL[b.url];if(bid)HIT_BY_ID[bid]=hit;});
    // Stop numbers belong to a route, so browsing leaves them off.
    if(!browse)hit.bindTooltip(String(pos+1),{permanent:true,direction:'center',className:'num'});
    // A phone shows the stop in the bottom sheet; a big screen in a popup.
    hit._html=html;
    if(isMobile())hit.on('click',function(){openStop(hit);});
    else hit.bindPopup(html,{maxWidth:Math.min(320,window.innerWidth-40)});
  });
  if(!browse&&line.length>1)L.polyline(line,{pane:'routePane',color:col,weight:4,opacity:.6,interactive:false}).addTo(layer);
  var lbl=(!sel.length&&onC.length===1?circuitName(onC[0])+' · ':'');
  document.getElementById('stats').textContent=lbl+nB+' boulders · '+stops.length+(browse?' sectors':' stops · '+(dist/1000).toFixed(2)+' km');
  // The parking is only the start point of the walk; nothing is drawn there.
  var all=line;
  // Refit when asked, and when a newly added boulder would sit off-screen.
  var focus=focusId&&BY_ID[focusId]?toB(BY_ID[focusId]):null;
  if(fit||(focus&&!map.getBounds().contains([focus.lat,focus.lng]))){
    var pad=isMobile()?[30,30]:[50,50];map.fitBounds(all,{padding:pad});}
  // The stop numbers are known now, so the circuit list can follow the same order.
  renderPicked();
  syncHash();
}
if(!isMobile()) openPanel();
window.addEventListener('resize',function(){if(!isMobile()){panel.classList.remove('hidden');}});
parseHash();syncG();syncC();syncR();
// Only unfold the filters when a shared link actually narrows something.
foldFilters(GORD.some(function(g){return !gradeOn[g];})||charList.some(function(c){return !charOn[c];})||minRating>0);
// A shared circuit is the point of the link: show it alone unless lists were shared too.
if(CIRCUITS.length&&!/[#&]l=/.test(location.hash))DATA.forEach(function(_,i){listOn[i]=false;});
renderLists();
render(true);
</script></body></html>
